# Adiciona um server block extra na porta 8080 só com o endpoint de status,
# sem tocar no default.conf que serve a aplicação na porta 80.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-status-conf
  namespace: frontend
data:
  status.conf: |
    server {
      listen 8080;
      location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-status-conf
  namespace: backend
data:
  status.conf: |
    server {
      listen 8080;
      location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
      }
    }
  default.conf: |
    server {
      listen 80;
      location / {
        return 200 '{"status":"ok","service":"backend-api"}';
        add_header Content-Type application/json;
      }
    }
